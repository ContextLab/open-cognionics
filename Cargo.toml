[package]
name = "open-cognionics"
version = "0.0.1"
edition = "2021"
description = "Platform independent library for streaming and recording Cognionics (CGX) EEG data"
license = "MIT"
repository = "https://github.com/ContextLab/open-cognionics"

[lib]
name = "open_cognionics"
path = "src/lib.rs"
# cdylib: the Python extension module (feature `python`); rlib: the Rust library.
# maturin finds the extension only through a cdylib target ("No Cargo targets
# to build" without it). Without the `python` feature the cdylib holds no
# Python code and adds about 16 KB and well under a second to a build.
crate-type = ["cdylib", "rlib"]

[dependencies]
ctrlc = { version = "3.5.3", features = ["termination"], optional = true }
numpy = { version = "0.30.0", optional = true }
pyo3 = { version = "0.30.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serialport = { version = "4.10.1", optional = true }
tiny_http = { version = "0.12.0", optional = true }
tungstenite = { version = "0.30.0", optional = true }

[features]
# Live connection to the headset over its USB serial dongle.
serial = ["dep:serialport"]
# Local web server: serial link to the headset, live stream and guided recording.
server = ["serial", "dep:tungstenite", "dep:tiny_http", "dep:ctrlc"]
# Python bindings (the `open_cognionics._core` extension module, built by maturin).
python = ["serial", "dep:pyo3", "dep:numpy", "dep:pyo3-build-config"]

[[bin]]
name = "open-cognionics"
path = "src/bin/serve.rs"
required-features = ["server"]

# Pseudo-terminals for the transport tests (tests/common/pty_device.rs).
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.30.1", features = ["term", "fs", "signal"] }

[[example]]
name = "hardware_check"
required-features = ["serial"]

[build-dependencies]
pyo3-build-config = { version = "0.30.1", optional = true }
