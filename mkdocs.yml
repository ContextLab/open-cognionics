site_name: open-cognionics
docs_dir: docs
exclude_docs: |
  superpowers/
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API: api.md
  - Recordings: recordings.md
  - Device: device.md
  - Protocol: protocol.md
  - Channel order check: channel-order-check.md
  - brain-mapper: brain-mapper.md
  - brain-mapper results: brain-mapper-results.md
  - Running a session: brain-mapper-tonight.md
theme:
  name: material
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source
            inherited_members: false
            show_if_no_docstring: true
            allow_inspection: true
            force_inspection: true
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
